[project]
name = "tictactoe"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "RET", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests compare against literal values on purpose.
"tests/**" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
