[project]
name = "demos-ai-coding"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic",
    "bleach",
    "chromadb",
    "faker",
    "flask",
    "markupsafe",
    "mcp",
    "passpy",
    "pyarrow",
    "pytest",
]

[dependency-groups]
dev = [
    # uv-managed venvs ship without pip, but `rsconstruct doctor` verifies
    # installed packages through the `pip` on PATH; without this it silently
    # checks the system interpreter instead of this venv.
    "pip",
    "pyrefly",
    "pytest",
    "ruff",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor). preset = "legacy" is
# pyrefly's mypy-compatible behavior; "." on the search path is mypy's
# implicit current directory.
preset = "legacy"
search-path = [
    ".",
]
# Loose scripts import their siblings: search each importing file's folder.
enable-fallback-search-path = true
# Third-party libraries without type information.
ignore-missing-imports = [
    "anthropic.*",
    "bleach.*",
    "passpy.*",
    "pyarrow.*",
]
