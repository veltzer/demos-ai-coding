[project]
name = "demos-ai-coding"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic",
    "bleach",
    "chromadb",
    "faker",
    "flask",
    "markupsafe",
    "mcp",
    "passpy",
    "pyarrow",
    "pytest",
]

[dependency-groups]
dev = [
    "mypy",
    # uv-managed venvs ship without pip, but `rsconstruct doctor` verifies
    # installed packages through the `pip` on PATH; without this it silently
    # checks the system interpreter instead of this venv.
    "pip",
    "pylint",
    "pytest",
    "ruff",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.mypy]
mypy_path = "src:python:scripts"
explicit_package_bases = true
namespace_packages = true

# Third-party libraries without type stubs; `foo.*` also matches `foo` itself.
[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "bleach.*",
    "passpy.*",
    "pyarrow.*",
]
ignore_missing_imports = true
