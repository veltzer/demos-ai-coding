# Generated to let `uv sync` install this repo's Python dependencies.
# The authoritative dependency list is [dependencies].pip in
# rsconstruct.toml; keep the two in sync when editing.

[project]
name = "demos-ai-coding"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic",
    "bleach",
    "chromadb",
    "faker",
    "flask",
    "markupsafe",
    "passpy",
    "pyarrow",
    "pytest",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.mypy]
mypy_path = "src:python:scripts"
explicit_package_bases = true
namespace_packages = true

# pyarrow ships no py.typed marker; without stubs installed mypy fails
# the import as untyped.
[[tool.mypy.overrides]]
module = [
    "pyarrow.*",
]
ignore_missing_imports = true
