# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[analyzer.markdown]

[analyzer.python]

[processor.checker.rumdl]
src_dirs = ["examples", "exercises", "live-demos/agents"]
src_files = ["CLAUDE.md", "README.md"]

[processor.checker.zspell]
src_dirs = "${doc_dirs}"

# ─── python ──────────────────────────────────────────────────────────────────

[processor.checker.ruff]
src_dirs = "${py_dirs}"


[processor.checker.pyrefly]
src_dirs = "${py_dirs}"

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.checker.ishellcheck]
src_dirs = ["exercises"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

# run the tests of the examples with pytest (policy: [tool.pytest.ini_options])
[processor.checker.pytest]
src_dirs = ["live-examples/01_importance_of_documentation/app/tests", "live-examples/05_hooks_beat_instructions/app/tests", "live-examples/08_intent_to_production/app/tests"]

[processor.checker.taplo]
src_files = [".ruff.toml", ".rumdl.toml", "live-examples/08_intent_to_production/app/pyproject.toml", "pyproject.toml", "rsconstruct.toml"]

# ─── repo-specific configuration ────────────────────────────────────────────

[vars]
# The Makefile only ever built and checked exercises/. The examples/ and
# live-demos/ trees are demo material shown live, not published handouts.
doc_dirs = ["exercises"]

# Everywhere Python lives in this repo. Canonical omits examples/.
# scripts/ is listed for the day it comes back; missing dirs are skipped.
py_dirs = ["examples", "exercises"]

# ─── document generation (was: MD_HTM / MD_PDF / MD_DOCX) ────────────────────

# The Makefile ran `markdown` (the Perl script) for html and pandoc for
# pdf/docx. pandoc handles all three, so one processor replaces both rules.
# Output lands in out/processor.generator.pandoc.exercises/<category>/<name>/exercise.<fmt> rather
# than the Makefile's out/exercises/<category>/<name>.<fmt>.
#
# xelatex rather than pandoc's default pdflatex: some exercises use box-drawing
# characters for directory trees, check marks in decision tables, and ordinary
# typographic punctuation (em dash, ≤, →). pdflatex is 8-bit only and dies on
# all of it, which is why those two exercises never produced a PDF under the
# Makefile. xelatex is Unicode-native and renders them as written.
[processor.generator.pandoc.exercises]
# rspandoc, the Rust replacement: it takes pandoc's command line
command = "rspandoc"
src_dirs = "${doc_dirs}"
formats = ["html", "pdf", "docx"]
pdf_engine = "xelatex"
# The docx takes its look from the shared-themes submodule's reference
# document, like the syllabi; pandoc's built-in styles are the bare default.
args = ["--reference-doc=shared/shared-themes/docx/azure.docx"]
dep_inputs = ["shared/shared-themes/docx/azure.docx"]

# The Makefile also ran a pure-ASCII check (grep -P "[^\x00-\x7F]") on every
# exercise. It existed to keep the pdflatex path working; with xelatex doing
# the typesetting the constraint no longer buys anything, and it was rejecting
# content the author wrote deliberately. Deliberately not carried over.

# ─── markdown lint / spelling scope ──────────────────────────────────────────

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# audit the GitHub Actions workflow files for security problems with zizmor
# (policy: .github/zizmor.yml)
[processor.checker.zizmor]
src_dirs = [".github/workflows"]
# The auditor persona, zizmor's strictest: everything the pedantic one
# reports (undocumented permissions, template expansion of any context,
# unnamed jobs, ...) plus the findings that need a person to judge them.
# --offline and --no-progress are the default args.
args = ["--offline", "--no-progress", "--persona=auditor"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.checker.iyamllint]
src_files = [".hadolint.yaml", ".yamllint.yaml"]
src_dirs = [".github", "exercises/03_software_engineering/04_infrastructure_as_code/code"]

# ─── docker ──────────────────────────────────────────────────────────────────

[processor.checker.idockerfile]
src_dirs = ["exercises/03_software_engineering/04_infrastructure_as_code/code/docker"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.checker.ijsonlint]
src_dirs = ["examples/airline-ticket-agent-node", "exercises/04_advanced_techniques/01_your_own_mcp_server", "live-examples"]

# ─── javascript ──────────────────────────────────────────────────────────────

# the pages and stylesheets of the live examples
[processor.checker.itidy]
src_dirs = ["live-examples"]

[processor.checker.biome]
src_dirs = ["live-examples"]
src_extensions = [".css"]

[processor.checker.oxlint]
src_dirs = ["examples/airline-ticket-agent-node", "exercises/04_advanced_techniques/01_your_own_mcp_server", "live-examples"]
args = ["-c", ".oxlintrc.repo.json"]
dep_inputs = [".oxlintrc.repo.json"]

# lint the Lua configuration with luacheck (policy: .luacheckrc)
[processor.checker.iluacheck]
src_dirs = ["config"]

# every lint suppression names a rule and says why (see the fleet's CLAUDE.md)
[processor.checker.suppressions]
src_dirs = [".github", "config", "examples", "exercises", "live-demos/agents", "live-examples"]
src_files = [".hadolint.yaml", ".yamllint.yaml", "CLAUDE.md", "README.md"]
